<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Trámite de Prácticas</title>
<link rel="stylesheet" href="css/diseno.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">EXP</span>
      <span>Sistema de Prácticas</span>
    </div>
    <div class="topbar-derecha">
      <span class="topbar-usuario">Hola, <strong id="usuario-nombre-topbar">...</strong></span>
      <button class="topbar-salir" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor" id="contenido-principal">
    <div class="spinner-carga">Cargando tu información...</div>
  </main>

  <div class="toast" id="toast">
    <span id="toast-texto">Listo</span>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/estudiante.js"></script>
</body>
</html>
